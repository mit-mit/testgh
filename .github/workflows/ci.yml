name: Dart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, 3.7.0]
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [x64, arm, arm64]
        exclude:
          - os: macos-latest
            arch: arm
          - os: windows-latest
            arch: arm
    steps:
      - uses: actions/checkout@v2
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
          architecture: ${{ matrix.arch }}
      - name: Dart version
        run: dart --version
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze code
        run: dart analyze
      - name: Run tests
        run: dart test
